name: 🐞 网页版问题
description: 网页版扫码登录、卡在结算/提交、闪退、ChromeDriver 等问题
title: "[Web] "
labels: ["bug", "web", "needs-info"]
body:
  - type: markdown
    attributes:
      value: |
        网页版容易被风控，提交卡住时先看日志里有没有滑块验证码。

        **日志很重要**：任务面板里的日志请整段复制，或贴终端输出；有截图也一并拖进来。
        没有日志的 issue 只能等补充，超过 7 天会自动关闭。

  - type: dropdown
    id: platform
    attributes:
      label: 抢购平台
      options:
        - 淘宝
        - 京东
        - 两个都有
    validations:
      required: true

  - type: dropdown
    id: launch
    attributes:
      label: 启动方式
      options:
        - start.bat
        - uv run python app.py
        - 其他（请在复现步骤里说明）
    validations:
      required: true

  - type: input
    id: os
    attributes:
      label: 操作系统
      placeholder: 例如 Windows 11 / macOS 15 / Ubuntu 24.04
    validations:
      required: true

  - type: input
    id: chrome
    attributes:
      label: Chrome 版本
      description: 地址栏打开 chrome://version 查看
      placeholder: 例如 148.0.7778.167
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      description: 说明卡在哪一步（扫码登录 / 购物车确认 / 结算 / 提交）、是否出现滑块
      placeholder: |
        1. uv run python app.py
        2. 选择淘宝，设置 14:00:00
        3. 扫码登录后确认购物车
        4. 到点后停在结算页，没有提交，日志见下
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: 日志
      description: 任务日志面板整段复制，或终端输出
      render: shell
    validations:
      required: true

  - type: checkboxes
    id: checks
    attributes:
      label: 提交前确认
      options:
        - label: 已更新到最新 main，并重新执行过 `uv sync`
          required: true
        - label: 已确认不是「按钮是灰色 / 出现滑块验证码」这类风控问题
          required: false
