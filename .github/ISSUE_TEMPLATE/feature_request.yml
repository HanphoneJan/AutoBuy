name: ✨ 想要新功能
description: 希望 App 多做什么？一句话也可以
title: "[建议] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        不用写方案，说清楚你希望它帮你做什么就行。

  - type: textarea
    id: idea
    attributes:
      label: 你想要什么？
      description: 说人话就行，比如「希望能支持唯品会」「希望到点自动开始，不用一直看着」
      placeholder: 例如：希望可以只买购物车里的某一件商品，而不是最上面那件。
    validations:
      required: true

  - type: textarea
    id: extra
    attributes:
      label: 还有什么想补充的？（可选，可以留空）
    validations:
      required: false
